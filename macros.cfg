#####################################################################
#   Macros
#####################################################################
[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28                       ; Home if not homed to get everything turned on
    QUAD_GANTRY_LEVEL         ; Level
    # G28 X Y                   ; Home the X and Y
    # G0 X130 Y355 Z2 F9000     ; Move to brush
    # G0 X75 F750               ; Move across the brush
    # G0 X130 F750              ; Move across the brush
    G28 Z                     ; Home the Z now that nozzle is clean
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z20 F6000    ; Return to center of bed

[gcode_macro PRINT_START]
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_START

    {% set bed_temp = params.BED | default(55) | float %}
    {% set e0_temp = params.EXTRUDER | default(210) | float %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    M190 S{bed_temp} ; wait for bed temperature
    G32
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={e0_temp}
    M109 S{e0_temp} ; wait for extruder temperature

    SET_PIN PIN=ledblue VALUE=1
    SET_PIN PIN=ledgreen VALUE=1
    SET_PIN PIN=ledred VALUE=1

    BED_MESH_PROFILE LOAD="default"

    G1 X50 Y0 F4000 ; move to prime
    G92 E0 ; reset extrusion distance
    G1 Z0.3 F2000 ; get ready to prime
    G1 X100 E4 F1000 ; Unretract and wipe
    G1 X200 E16 F2000 ; prime nozzle
    G1 X250  F3000 ; quick wipe

    RESTORE_GCODE_STATE NAME=STATE_PRINT_START

[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    SET_PIN PIN=ledblue VALUE=1
    SET_PIN PIN=ledgreen VALUE=1
    SET_PIN PIN=ledred VALUE=1

[gcode_macro M600]
gcode:
    description: Filament change
    PAUSE X={printer.toolhead.axis_maximum.x / 2} Y=10 Z_MIN=50
    UNLOAD_FILAMENT

[gcode_macro UNLOAD_FILAMENT]
gcode:
    M83                            ; set extruder to relative
    G1 E10 F300                    ; extrude a little to soften tip
    G1 E-40 F1800                  ; retract some, but not too much or it will jam
    M82                            ; set extruder to absolute

[gcode_macro LOAD_FILAMENT]
gcode:
    M83                            ; set extruder to relative
    G1 E30 F300                    ; load
    G1 E15 F150                    ; prime nozzle with filament
    M82                            ; set extruder to absolute
	_CLIENT_RETRACT

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=ledblue VALUE=0.0
    SET_PIN PIN=ledgreen VALUE=0.0
    SET_PIN PIN=ledred VALUE=0.0

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=ledblue VALUE=1.0
    SET_PIN PIN=ledgreen VALUE=1.0
    SET_PIN PIN=ledred VALUE=1.0

